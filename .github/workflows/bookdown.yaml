# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
  pull_request:
  workflow_dispatch:

name: bookdown

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bookdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Add WildlifeSystems apt repository
        run: |
          sudo wget -O /usr/share/keyrings/ws.gpg https://wildlife.systems/ws.gpg
          echo -e "Types: deb\nURIs: https://apt.wildlife.systems\nSuites: stable\nComponents: main\nArchitectures: all amd64\nSigned-By: /usr/share/keyrings/ws.gpg" | sudo tee /etc/apt/sources.list.d/ws.sources > /dev/null

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ libncurses-dev zlib1g-dev sensor-control

      - name: Build sensor-tools from source
        run: |
          git clone --depth 1 https://github.com/Wildlife-Systems/sensor-tools.git /tmp/sensor-tools
          cd /tmp/sensor-tools
          make sensor-data
          sudo cp sensor-data /usr/local/bin/
          sensor-data --version

      - name: Install R dependencies
        run: |
          install.packages(c("bookdown", "remotes", "reticulate", "tinytex"))
          remotes::install_github("edwbaker/figuREd")
          remotes::install_deps(dependencies = TRUE)
          tinytex::install_tinytex()
        shell: Rscript {0}

      - name: Install additional LaTeX packages
        run: |
          tinytex::tlmgr_install(c("fancyhdr", "booktabs", "longtable", "array", "multirow", "wrapfig", "colortbl", "tabu", "varwidth", "threeparttable", "threeparttablex", "environ", "trimspaces", "ulem", "makecell", "natbib"))
        shell: Rscript {0}

      - name: Cache bookdown results
        uses: actions/cache@v4
        with:
          path: _bookdown_files
          key: bookdown-${{ hashFiles('**/*Rmd') }}
          restore-keys: bookdown-

      - name: Ensure cache directory exists
        run: mkdir -p _bookdown_files

      - name: Build HTML site
        run: bookdown::render_book("index.Rmd", quiet = TRUE)
        shell: Rscript {0}

      - name: Build PDF book
        run: bookdown::render_book("index.Rmd", "bookdown::pdf_book", quiet = TRUE)
        shell: Rscript {0}
        continue-on-error: true

      - name: Build EPUB book
        run: bookdown::render_book("index.Rmd", "bookdown::epub_book", quiet = TRUE)
        shell: Rscript {0}
        continue-on-error: true

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress './docs/**/*.html' --exclude 'localhost|127.0.0.1|wildlife.systems|github.com/rstudio'
          fail: false

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    needs: bookdown
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
